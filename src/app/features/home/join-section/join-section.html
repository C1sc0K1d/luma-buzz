<section class="u-section join-banner" aria-labelledby="join-title">
  <div class="join-banner__artwork" aria-hidden="true">
    <span class="join-banner__shape join-banner__shape--circle"></span
    ><span class="join-banner__shape join-banner__shape--square"></span
    ><span class="join-banner__shape join-banner__shape--corner"></span
    ><span class="join-banner__shape join-banner__shape--dot"></span
    ><span class="join-banner__shape join-banner__shape--ball"></span
    ><span class="join-banner__shape join-banner__shape--ring"></span
    ><svg class="join-banner__shape join-banner__shape--cube" viewBox="0 0 60 60" fill="none">
      <path
        d="m30 2 27 16v26L30 59 3 44V18L30 2Zm0 0v57M3 18l54 26M57 18 3 44M3 18l27 16 27-16"
      /></svg
    ><span class="join-banner__shape join-banner__shape--small-ring"></span>
  </div>
  <div class="u-container join-banner__inner">
    <div class="avatar-stack" aria-hidden="true">
      @for (n of [1, 2, 3, 4]; track n) {
        <img [src]="'images/avatar-' + n + '.jpg'" alt="" width="40" height="40" loading="lazy" />
      }
    </div>
    <h2 id="join-title">What will you learn next?</h2>
    <p>Start with one course. Build from there.</p>
    <div class="u-actions">
      <a class="button button--primary" href="#courses">Explore all courses</a
      ><a class="button button--secondary" href="#contact">Join Luma</a>
    </div>
  </div>
</section>
